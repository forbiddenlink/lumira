[project]
name = "lumira"
version = "0.1.0"
description = "Lumira - Autonomous AI artist illuminating spaces between feeling and form"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Lumira Project" }
]

dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "diffusers>=0.27.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "peft>=0.7.0",
    "safetensors>=0.4.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "structlog>=24.4.0,<26.0.0",
    "tqdm>=4.66.0",
    "fastapi>=0.115.0,<0.130.0",
    "python-multipart>=0.0.17,<0.1.0",
    "uvicorn[standard]>=0.32.0,<0.42.0",
    "websockets>=12.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "opencv-python-headless>=4.13.0.90",
    "aiofiles>=25.1.0",
    "mangum>=0.19.0,<1.0.0",
    "redis>=5.0.0", # Required for caching and job queue
    "rq>=1.16.0", # Redis job queue
    "replicate>=1.0.0", # Cloud image generation via Replicate API
    "anthropic>=0.84.0",
    "chromadb>=1.5.4",
]

[project.scripts]
lumira = "ai_artist.main:main"
lumira-gallery = "ai_artist.gallery.viewer:main"
lumira-schedule = "ai_artist.scheduling.cli:main"
lumira-web = "ai_artist.web.cli:main"
lumira-worker = "ai_artist.queue.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_artist = ["web/templates/*.html", "web/static/**/*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "black>=24.0.0",
    "pre-commit>=3.6.0",
]
training = [
    "wandb>=0.16.0",
    "xformers>=0.0.24",
]
quality = [
    "imagehash>=4.3.0",
]
aesthetics = [
    "simple-aesthetics-predictor>=0.1.2",
    "transformers>=4.38.0",
]
monitoring = [
    "sentry-sdk[fastapi]>=2.0.0",
    "prometheus-client>=0.20.0",
]
flux = [
    "diffusers>=0.31.0",  # FLUX support
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]
controlnet = [
    "controlnet-aux>=0.0.9",
]
provenance = [
    "c2pa-python>=0.6.0",  # C2PA content provenance (EU AI Act compliance)
]
queue = [
    "rq-dashboard>=0.7.0",  # Optional admin UI (rq is now in core deps)
]
knowledge = [
    "falkordb>=1.0.0",  # Graph database for semantic knowledge
]
graph = [
    "falkordb>=1.0.0",  # Graph memory for institutional knowledge
]
social = [
    "tweepy>=4.14.0",  # Twitter/X API
    "instagrapi>=2.1.0",  # Instagram API
    "atproto>=0.0.55",  # Bluesky/AT Protocol
]
agiqa = [
    "scipy>=1.12.0",  # For AGIQA image analysis
]
e2e = [
    "pytest-playwright>=0.5.0",  # Browser automation for E2E tests
]
video = [
    "moviepy>=2.1.1",  # Video generation from AI images
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",   # Line too long - handled by formatter
    "B008",   # FastAPI Depends() pattern is standard
    "UP042",  # str/Enum inheritance is valid for JSON-serializable enums
]

[tool.ruff.lint.per-file-ignores]
# app.py has intentional E402 for path setup before imports
"src/ai_artist/web/app.py" = ["E402"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "e2e: marks end-to-end tests requiring browser (Playwright)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [".history", "scripts/"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "aiofiles.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "types-aiofiles>=25.1.0.20251011",
    "fakeredis>=2.21.0",  # For queue tests
    "pytest-playwright>=0.6.2",  # For e2e tests
]
