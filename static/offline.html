<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Lumira</title>
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512x512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :focus-visible {
            outline: 2px solid #58a6ff;
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (prefers-contrast: high) {
            body { background: #000; }
            h1 { background: none; -webkit-text-fill-color: #ffff00; }
            .retry-button { background: #ffff00; color: #000; }
        }

        @media (forced-colors: active) {
            .retry-button, .nav-links a { border: 2px solid ButtonText; }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .offline-container {
            text-align: center;
            max-width: 500px;
        }

        .offline-icon {
            font-size: 96px;
            margin-bottom: 24px;
            opacity: 0.7;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #58a6ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #8b949e;
            margin-bottom: 28px;
        }

        .retry-button {
            background: linear-gradient(135deg, #58a6ff, #a855f7);
            border: none;
            color: white;
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(88, 166, 255, 0.3);
        }

        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(88, 166, 255, 0.4);
        }

        .retry-button:active {
            transform: translateY(0);
        }

        .cached-notice {
            margin-top: 32px;
            padding: 16px 20px;
            background: rgba(88, 166, 255, 0.06);
            border-radius: 12px;
            border-left: 4px solid #58a6ff;
        }

        .cached-notice p {
            font-size: 0.9rem;
            margin: 0;
        }

        .nav-links {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .nav-links a {
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border: 1px solid #21262d;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            color: #e6edf3;
            border-color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry, Lumira's artwork is still here!</p>

        <button class="retry-button" onclick="window.location.reload()">
            Try Again
        </button>

        <div class="cached-notice">
            <p>💡 <strong>Tip:</strong> You can still browse previously viewed artwork while offline thanks to PWA caching.</p>
        </div>

        <div class="nav-links">
            <a href="/">Gallery</a>
            <a href="/lumira">Creative Studio</a>
        </div>
    </div>

    <script>
        // Auto-retry when online
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Check connection periodically
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
