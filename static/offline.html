<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Lumira</title>
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512x512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #12100e;
            --panel: #1a1714;
            --text: #ebe4d8;
            --muted: #9a9084;
            --accent: #c4a574;
            --border: color-mix(in oklab, #ebe4d8 10%, transparent);
            --font-display: "Fraunces", Georgia, serif;
            --font-ui: "Figtree", system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .skip-link {
            position: absolute;
            top: -100%;
            left: 0;
            background: var(--accent);
            color: #12100e;
            padding: 0.5rem 1rem;
            z-index: 9999;
            font-weight: 600;
            text-decoration: none;
            border-radius: 0 0 8px 0;
            font-family: var(--font-ui);
        }
        .skip-link:focus {
            top: 0;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        :focus:not(:focus-visible) {
            outline: none;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (prefers-contrast: high) {
            :root {
                --bg: #000;
                --panel: #0a0a0a;
                --text: #fff;
                --muted: #ccc;
                --accent: #ffff00;
            }
        }

        @media (forced-colors: active) {
            .retry-button, .nav-links a { border: 2px solid ButtonText; }
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(
                ellipse 60% 45% at 50% 30%,
                color-mix(in oklab, var(--accent) 8%, transparent),
                transparent 70%
            );
        }

        .offline-container {
            position: relative;
            text-align: center;
            max-width: 480px;
        }

        .brand {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.875rem;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .offline-mark {
            width: 48px;
            height: 48px;
            margin: 0 auto 1.5rem;
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
        }

        .offline-mark svg {
            width: 22px;
            height: 22px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1rem;
            line-height: 1.65;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .retry-button {
            background: var(--accent);
            border: none;
            color: #12100e;
            padding: 0.75rem 2rem;
            font-size: 0.9375rem;
            font-weight: 600;
            font-family: var(--font-ui);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .retry-button:hover {
            background: color-mix(in oklab, var(--accent) 82%, white);
        }

        .cached-notice {
            margin-top: 2rem;
            padding: 1rem 1.25rem;
            background: var(--panel);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            text-align: left;
        }

        .cached-notice p {
            font-size: 0.875rem;
            margin: 0;
            color: var(--muted);
        }

        .cached-notice strong {
            color: var(--text);
            font-weight: 600;
        }

        .nav-links {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .nav-links a:hover {
            color: var(--text);
            border-color: color-mix(in oklab, var(--accent) 40%, var(--border));
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <div class="offline-container" id="main-content">
        <div class="brand">LUMIRA</div>

        <div class="offline-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7z"/>
                <line x1="4" y1="4" x2="20" y2="20"/>
            </svg>
        </div>

        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry, Lumira's artwork is still here.</p>

        <button class="retry-button" onclick="window.location.reload()">
            Try Again
        </button>

        <div class="cached-notice">
            <p><strong>Tip:</strong> You can still browse previously viewed artwork while offline thanks to PWA caching.</p>
        </div>

        <nav class="nav-links" aria-label="Site">
            <a href="/">Gallery</a>
            <a href="/lumira">Creative Studio</a>
        </nav>
    </div>

    <script>
        window.addEventListener('online', () => {
            window.location.reload();
        });

        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
