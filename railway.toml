# Railway Configuration for Lumira
# Lightweight gallery + cloud-generation deployment (no local ML / no GPU).
# Uses Dockerfile.gallery: the web app boots torch-free and image generation
# runs via the cloud Replicate API. The full-ML Dockerfile is not viable on
# Railway (no GPU, multi-GB image).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.gallery"

[deploy]
# Don't use startCommand when using Dockerfile - let the Dockerfile CMD handle it
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables (set in Railway dashboard / `railway variables`):
# Required:
# - RAILWAY_API_KEY   -> enables fail-closed auth on generation/admin routes
#                        (gallery browsing stays public). Without it those
#                        routes return 503.
# Optional (cloud generation — Magica preferred, Replicate fallback):
# - MAGICA_API_KEY        -> Magica/Galaxy AI multi-model image (+ audio/video APIs)
# - REPLICATE_API_TOKEN   -> Replicate fallback + img2img/variations
# - LUMIRA_AUTO_SOUNDTRACK=1 -> pair new artworks with Magica instrumentals
# - ALLOWED_ORIGINS=https://<your-domain>  -> CORS/WebSocket allowlist
# - UNSPLASH_ACCESS_KEY / UNSPLASH_SECRET_KEY -> stock-image features
