name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast lint job - fails fast before expensive test jobs
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Lint with Ruff
      run: uvx ruff check src/ tests/ --output-format=github

    - name: Check code formatting with Black
      run: uvx black --check src/ tests/

    # Type checking needs the project's dependencies present. Under the old
    # `uvx --with pydantic mypy` the environment held mypy and pydantic and
    # nothing else, so --ignore-missing-imports resolved every SQLAlchemy,
    # torch and diffusers symbol to Any and the check had almost nothing left
    # to catch -- 27 real errors were passing CI (#90).
    - name: Install dependencies
      run: uv sync --dev

    - name: Type check with mypy
      run: uv run --frozen mypy src/ --ignore-missing-imports

  # Dependency security review on PRs
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Dependency Review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  test:
    name: Test Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint  # Only run tests if linting passes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --dev --python ${{ matrix.python-version }}

    - name: Run tests with pytest
      run: |
        uv run --frozen --python ${{ matrix.python-version }} pytest tests/ -v -m "not slow" \
          --ignore=tests/e2e \
          --cov=src/ai_artist \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=60 \
          --junitxml=test-results.xml

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: test-results.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Integration/slow tests only on main branch pushes
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --dev --python 3.11

    - name: Run slow/integration tests
      run: |
        uv run --frozen --python 3.11 pytest tests/ -v -m "slow or integration" --timeout=600

  # E2E tests with Playwright (browser automation).
  # Runs on PRs too (not just post-merge) so a broken UI is caught before merge.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --dev --python 3.11

    - name: Install Playwright browsers
      run: uv run --python 3.11 playwright install chromium --with-deps

    - name: Run E2E tests
      run: |
        uv run --frozen --python 3.11 pytest \
          tests/e2e/test_gallery_ui.py \
          tests/e2e/test_lumira_ui.py \
          -v \
          -s \
          --browser chromium \
          --tb=short \
          --durations=10 \
          --junitxml=e2e-results.xml

    - name: Upload Playwright traces
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: playwright-traces
        path: test-results/

    - name: Upload E2E test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: e2e-test-results
        path: e2e-results.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF uploads

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install security tools
      run: uv tool install safety && uv tool install bandit

    - name: Check for vulnerabilities with Safety
      run: |
        safety scan --output json > safety-report.json || safety check --json > safety-report.json || true
      continue-on-error: true

    - name: Security scan with Bandit (SARIF)
      run: |
        bandit -r src/ -f sarif -o bandit.sarif || true

    - name: Security scan with Bandit (fail on HIGH severity)
      run: |
        bandit -r src/ --severity-level high --confidence-level high -f screen

    - name: Upload Bandit SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: bandit.sarif
      continue-on-error: true

    - name: Upload Bandit report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: bandit-security-report
        path: bandit.sarif

    - name: Upload Safety report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: safety-report
        path: safety-report.json

  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Lint Markdown files
      uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
      with:
        globs: '**/*.md'
        config: '.markdownlint.json'
      continue-on-error: true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install build dependencies
      run: uv tool install build && uv tool install twine

    - name: Build package
      run: pyproject-build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-packages
        path: dist/
