# Lumira Configuration

# Model settings
model:
  base_model: "stabilityai/stable-diffusion-xl-base-1.0"
  # Image backend: "local" | "replicate" | "magica" (default local)
  backend: magica
  # Options: "cuda" (NVIDIA GPU), "mps" (Apple Silicon), "cpu"
  device: "cuda"
  # Options: "float16" (faster, less memory) or "float32" (more accurate)
  dtype: "float16"
  enable_attention_slicing: true
  enable_vae_slicing: true
  # LoRA settings (optional)
  lora_path: null  # Path to trained LoRA weights, e.g., "models/lora/my_style"
  lora_scale: 0.8  # LoRA strength (0.0-1.0)

# Generation parameters
generation:
  width: 1024
  height: 1024
  num_inference_steps: 30
  guidance_scale: 7.5
  num_variations: 3
  negative_prompt: "blurry, low quality, distorted, ugly, deformed, watermark, text"

# API keys (can also be set via environment variables)
api_keys:
  unsplash_access_key: "YOUR_UNSPLASH_ACCESS_KEY"
  unsplash_secret_key: "YOUR_UNSPLASH_SECRET_KEY"
  pexels_api_key: "YOUR_PEXELS_API_KEY"  # Optional
  hf_token: "YOUR_HUGGINGFACE_TOKEN"  # Optional

# Database
database:
  url: "sqlite:///./data/lumira.db"

# Scheduling (for automated mode)
scheduling:
  enabled: true
  timezone: "America/Los_Angeles"
  daily_creation:
    enabled: true
    hour: 9
    minute: 0

# Curation settings
curation:
  enabled: true
  quality_threshold: 0.6
  keep_top_n: 2

# Gallery settings
gallery:
  path: "./gallery"
  organize_by_date: true
  save_metadata: true
