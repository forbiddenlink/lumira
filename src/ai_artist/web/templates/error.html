<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} — Lumira</title>
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/static/icons/icon-512x512.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :focus-visible {
        outline: 2px solid #58a6ff;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media (prefers-contrast: high) {
        body {
          background: #000;
        }
        .code {
          -webkit-text-fill-color: #ffff00;
        }
        .btn {
          background: #ffff00;
          color: #000;
        }
      }
      @media (forced-colors: active) {
        .btn,
        .links a {
          border: 2px solid ButtonText;
        }
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          sans-serif;
        background: #050810;
        color: #e6edf3;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow: hidden;
      }

      /* Stars background */
      .stars {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
        opacity: 0;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.5);
        }
        50% {
          opacity: var(--o, 0.7);
          transform: scale(1);
        }
      }

      /* Nebula glow */
      .nebula {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(
            ellipse 60% 40% at 50% 50%,
            rgba(88, 166, 255, 0.07) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 40% 60% at 20% 80%,
            rgba(168, 85, 247, 0.08) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 50% 30% at 80% 20%,
            rgba(86, 212, 221, 0.06) 0%,
            transparent 70%
          );
        animation: nebulaDrift 20s ease-in-out infinite;
      }
      @keyframes nebulaDrift {
        0%,
        100% {
          transform: scale(1) translate(0, 0);
        }
        50% {
          transform: scale(1.08) translate(-10px, 8px);
        }
      }

      /* Noise overlay */
      .noise {
        position: fixed;
        inset: 0;
        z-index: 1;
        opacity: 0.025;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 220px;
      }

      .error-box {
        position: relative;
        z-index: 10;
        text-align: center;
        max-width: 560px;
        padding: 48px 32px;
        animation: reveal 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .error-glyph {
        font-size: clamp(96px, 18vw, 160px);
        font-weight: 700;
        font-family: "Space Grotesk", "Inter", sans-serif;
        letter-spacing: -8px;
        line-height: 1;
        background: linear-gradient(
          135deg,
          #58a6ff 0%,
          #a855f7 50%,
          #56d4dd 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: glypPulse 4s ease-in-out infinite;
        display: block;
        margin-bottom: 4px;
      }
      @keyframes glypPulse {
        0%,
        100% {
          filter: brightness(1) blur(0);
        }
        50% {
          filter: brightness(1.15) blur(0.3px);
        }
      }

      .error-eyebrow {
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: rgba(88, 166, 255, 0.7);
        font-family: "Space Grotesk", sans-serif;
        margin-bottom: 20px;
      }

      h1 {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: clamp(22px, 4vw, 30px);
        font-weight: 600;
        letter-spacing: -0.5px;
        margin-bottom: 14px;
        color: #e6edf3;
      }

      p {
        color: #8b949e;
        font-size: 16px;
        line-height: 1.7;
        margin-bottom: 40px;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 28px;
        background: linear-gradient(135deg, #58a6ff, #a855f7);
        color: white;
        text-decoration: none;
        border-radius: 14px;
        font-weight: 600;
        font-size: 15px;
        font-family: "Space Grotesk", sans-serif;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 4px 20px rgba(88, 166, 255, 0.3);
      }
      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 32px rgba(88, 166, 255, 0.45);
      }

      .btn-ghost {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #8b949e;
        box-shadow: none;
      }
      .btn-ghost:hover {
        border-color: rgba(88, 166, 255, 0.4);
        color: #e6edf3;
        box-shadow: none;
      }

      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #58a6ff, #a855f7);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="nebula" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <div class="error-box">
      <div class="error-eyebrow">Lumira &nbsp;/&nbsp; Error</div>
      <span class="error-glyph">{{ status_code }}</span>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <div class="actions">
        <a href="/" class="btn">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          Gallery
        </a>
        <a href="/lumira" class="btn btn-ghost">Creative Studio</a>
      </div>
    </div>

    <script>
      // Generate stars
      (function () {
        var container = document.getElementById("stars");
        var count = 80;
        for (var i = 0; i < count; i++) {
          var s = document.createElement("div");
          s.className = "star";
          var size = Math.random() * 2.5 + 0.5;
          s.style.cssText = [
            "width:" + size + "px",
            "height:" + size + "px",
            "left:" + Math.random() * 100 + "%",
            "top:" + Math.random() * 100 + "%",
            "--d:" + (Math.random() * 4 + 2) + "s",
            "--delay:-" + Math.random() * 6 + "s",
            "--o:" + (Math.random() * 0.6 + 0.2),
          ].join(";");
          container.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
