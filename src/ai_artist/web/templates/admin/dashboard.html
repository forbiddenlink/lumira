<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{ title }} — Lumira</title>
    <link rel="icon" href="/static/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap"
    />
    <style>
      /* Canonical token names — see design-system.txt. Do not introduce
         ad-hoc hex here; this console shares Lumira's warm-ink palette so the
         studio and its instruments read as one room. */
      :root {
        color-scheme: dark;
        --bg-dark: #12100e;
        --bg-panel: #1a1714;
        --bg-elevated: #221e1a;
        --text-main: #ebe4d8;
        --text-muted: #9a9084;
        --text-faint: #6e665c;
        --accent: #c4a574;
        --accent-hover: color-mix(in oklab, var(--accent) 82%, white);
        --border: color-mix(in oklab, #ebe4d8 10%, transparent);
        --border-strong: color-mix(in oklab, #ebe4d8 18%, transparent);
        --success: #7dba8a;
        --warning: #d4a84b;
        --danger: #d4646a;
        --focus-ring: color-mix(in oklab, var(--accent) 55%, transparent);
        --font-display: "Fraunces", "Times New Roman", serif;
        --font-ui: "Figtree", system-ui, sans-serif;
        --radius-sm: 6px;
        --radius-md: 10px;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      @media (forced-colors: active) {
        :root {
          --bg-dark: #000000;
          --bg-panel: #0a0a0a;
          --bg-elevated: #0a0a0a;
          --text-main: #ffffff;
          --text-muted: #cccccc;
          --border: #ffffff;
          --border-strong: #ffffff;
          --accent: #ffff00;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg-dark);
        color: var(--text-main);
        font-family: var(--font-ui);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 62rem;
        margin: 0 auto;
        padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1rem, 4vw, 2rem) 4rem;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem 1.5rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid var(--border-strong);
      }

      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 400;
        font-size: clamp(1.6rem, 3.5vw, 2.1rem);
        letter-spacing: -0.01em;
      }

      .subtitle {
        margin: 0;
        color: var(--text-faint);
        font-size: 0.85rem;
      }

      /* A ledger, not a grid of shadowed SaaS cards: hairline rules and
         typographic hierarchy carry the structure. */
      section {
        margin-top: 2.75rem;
      }

      h2 {
        margin: 0 0 0.25rem;
        font-family: var(--font-ui);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      dl {
        margin: 0;
        border-top: 1px solid var(--border);
      }

      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--border);
      }

      dt {
        color: var(--text-muted);
        min-width: 0;
      }

      dd {
        margin: 0;
        color: var(--text-main);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .row--art {
        align-items: flex-start;
      }

      .art-prompt {
        color: var(--text-main);
        overflow-wrap: anywhere;
      }

      .art-meta {
        display: flex;
        gap: 0.75rem;
        color: var(--text-faint);
        font-size: 0.82rem;
        font-variant-numeric: tabular-nums;
      }

      .state {
        padding: 0.9rem 0;
        color: var(--text-faint);
        font-size: 0.9rem;
      }

      .state--error {
        color: var(--danger);
      }

      .ok {
        color: var(--success);
      }
      .warn {
        color: var(--warning);
      }
      .bad {
        color: var(--danger);
      }

      button {
        font: inherit;
        color: var(--text-main);
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 0.45rem 0.9rem;
        cursor: pointer;
        transition: border-color 0.18s var(--ease-out);
      }

      button:hover {
        border-color: var(--accent);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button.danger[data-armed="true"] {
        border-color: var(--danger);
        color: var(--danger);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        padding-top: 0.9rem;
      }

      .auth {
        margin-top: 1.25rem;
        padding: 1rem;
        background: var(--bg-panel);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-md);
      }

      .auth p {
        margin: 0 0 0.75rem;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .auth form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      .auth input {
        flex: 1 1 16rem;
        font: inherit;
        color: var(--text-main);
        background: var(--bg-dark);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 0.45rem 0.7rem;
      }

      .auth input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      [hidden] {
        display: none !important;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <h1>{{ title }}</h1>
        <p class="subtitle" id="refreshed">Not yet refreshed</p>
      </header>

      <!-- Only shown once a data call is refused: the shell itself carries no
           data, so it does not need the key until it asks for something. -->
      <div class="auth" id="auth" hidden>
        <p id="auth-message">This console needs an API key to read data.</p>
        <form id="auth-form">
          <label class="visually-hidden" for="auth-key">API key</label>
          <input
            id="auth-key"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="X-API-Key"
          />
          <button type="submit">Use key</button>
        </form>
      </div>

      <section aria-labelledby="h-stats">
        <h2 id="h-stats">Collection</h2>
        <dl id="stats" aria-live="polite"></dl>
        <p class="state" id="stats-state">Loading…</p>
      </section>

      <section aria-labelledby="h-perf">
        <h2 id="h-perf">Generation</h2>
        <dl id="performance" aria-live="polite"></dl>
        <p class="state" id="performance-state">Loading…</p>
      </section>

      <section aria-labelledby="h-sys">
        <h2 id="h-sys">Host</h2>
        <dl id="system" aria-live="polite"></dl>
        <p class="state" id="system-state">Loading…</p>
      </section>

      <section aria-labelledby="h-recent">
        <h2 id="h-recent">Recent work</h2>
        <dl id="recent" aria-live="polite"></dl>
        <p class="state" id="recent-state">Loading…</p>
      </section>

      <section aria-labelledby="h-actions">
        <h2 id="h-actions">Actions</h2>
        <div class="actions">
          <button type="button" class="danger" id="clear-cache">
            Clear cache
          </button>
          <span class="state" id="action-state" aria-live="polite"></span>
        </div>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        var KEY_STORAGE = "lumira.adminApiKey";
        var REFRESH_MS = 30000;
        var timer = null;

        function storedKey() {
          try {
            return window.sessionStorage.getItem(KEY_STORAGE) || "";
          } catch (err) {
            return "";
          }
        }

        function storeKey(value) {
          try {
            window.sessionStorage.setItem(KEY_STORAGE, value);
          } catch (err) {
            /* private mode: key lives for this page load only */
          }
        }

        function el(id) {
          return document.getElementById(id);
        }

        function setState(id, message, isError) {
          var node = el(id);
          node.textContent = message || "";
          node.hidden = !message;
          node.classList.toggle("state--error", Boolean(isError));
        }

        // Every value below reaches the DOM through textContent. Prompts are
        // operator-supplied text and previously went through innerHTML, which
        // made any prompt containing markup executable in this console.
        function addRow(list, label, value, valueClass) {
          var row = document.createElement("div");
          row.className = "row";
          var dt = document.createElement("dt");
          dt.textContent = label;
          var dd = document.createElement("dd");
          dd.textContent = value;
          if (valueClass) dd.className = valueClass;
          row.appendChild(dt);
          row.appendChild(dd);
          list.appendChild(row);
        }

        function clear(node) {
          while (node.firstChild) node.removeChild(node.firstChild);
        }

        function showAuth(message) {
          el("auth-message").textContent = message;
          el("auth").hidden = false;
        }

        async function getJSON(path) {
          var headers = {};
          var key = storedKey();
          if (key) headers["X-API-Key"] = key;
          var response = await fetch(path, { headers: headers });
          if (response.status === 401 || response.status === 403) {
            var err = new Error("Not authorised");
            err.needsKey = true;
            throw err;
          }
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        }

        function handleFailure(stateId, error) {
          if (error && error.needsKey) {
            showAuth("This console needs a valid API key to read data.");
            setState(stateId, "Awaiting API key.", false);
            return;
          }
          setState(stateId, "Could not load: " + error.message, true);
        }

        function bytesToGB(bytes) {
          return (bytes / 1024 / 1024 / 1024).toFixed(1) + " GB";
        }

        function loadPercentClass(percent) {
          if (percent >= 90) return "bad";
          if (percent >= 75) return "warn";
          return "ok";
        }

        async function loadStats() {
          try {
            // `statuses` is the pipeline-state breakdown; the previous version
            // read a `moods` key this endpoint has never returned, which threw
            // before it could render anything below it.
            var data = await getJSON("/admin/stats");
            var list = el("stats");
            clear(list);
            addRow(list, "Total artworks", String(data.total_artworks));
            var statuses = data.statuses || {};
            Object.keys(statuses)
              .sort()
              .forEach(function (name) {
                addRow(list, name, String(statuses[name]));
              });
            setState("stats-state", "");
            renderRecent(data.recent);
          } catch (error) {
            handleFailure("stats-state", error);
            setState("recent-state", "Unavailable.", true);
          }
        }

        function renderRecent(items) {
          var list = el("recent");
          clear(list);
          if (!items || !items.length) {
            setState("recent-state", "No artworks yet.");
            return;
          }
          items.forEach(function (item) {
            var row = document.createElement("div");
            row.className = "row row--art";

            var dt = document.createElement("dt");
            dt.className = "art-prompt";
            dt.textContent = item.prompt || "Untitled";

            var dd = document.createElement("dd");
            dd.className = "art-meta";
            var status = document.createElement("span");
            status.textContent = item.status || "unknown";
            var score = document.createElement("span");
            score.textContent =
              typeof item.final_score === "number"
                ? item.final_score.toFixed(2)
                : "—";
            dd.appendChild(status);
            dd.appendChild(score);

            row.appendChild(dt);
            row.appendChild(dd);
            list.appendChild(row);
          });
          setState("recent-state", "");
        }

        async function loadPerformance() {
          try {
            var data = await getJSON("/admin/performance");
            var list = el("performance");
            clear(list);
            addRow(list, "Total generations", String(data.total_generations));
            addRow(
              list,
              "Average duration",
              Number(data.avg_duration).toFixed(1) + "s",
            );
            setState("performance-state", "");
          } catch (error) {
            handleFailure("performance-state", error);
          }
        }

        async function loadSystem() {
          try {
            var data = await getJSON("/admin/system");
            var list = el("system");
            clear(list);

            if (data.available === false) {
              setState(
                "system-state",
                data.detail || "Host metrics unavailable.",
              );
              return;
            }

            var cpu = Number(data.cpu_percent);
            addRow(
              list,
              "CPU",
              cpu.toFixed(1) + "%",
              loadPercentClass(cpu),
            );
            var mem = data.memory || {};
            addRow(
              list,
              "Memory",
              Number(mem.percent).toFixed(1) +
                "% · " +
                bytesToGB(mem.available) +
                " free",
              loadPercentClass(Number(mem.percent)),
            );
            var gpu = data.gpu || {};
            addRow(
              list,
              "GPU",
              gpu.available ? gpu.device_name || "available" : "none",
              gpu.available ? "ok" : null,
            );
            setState("system-state", "");
          } catch (error) {
            handleFailure("system-state", error);
          }
        }

        async function refresh() {
          el("refreshed").textContent =
            "Refreshed " + new Date().toLocaleTimeString();
          await Promise.all([loadStats(), loadPerformance(), loadSystem()]);
        }

        // Two-step button instead of window.confirm: a modal dialog blocks the
        // whole page and cannot be styled, dismissed by keyboard consistently,
        // or driven by the E2E suite.
        var clearButton = el("clear-cache");
        var armed = false;
        var armTimer = null;

        function disarm() {
          armed = false;
          clearButton.dataset.armed = "false";
          clearButton.textContent = "Clear cache";
        }

        clearButton.addEventListener("click", async function () {
          if (!armed) {
            armed = true;
            clearButton.dataset.armed = "true";
            clearButton.textContent = "Confirm clear cache";
            setState("action-state", "Click again to confirm.");
            window.clearTimeout(armTimer);
            armTimer = window.setTimeout(function () {
              disarm();
              setState("action-state", "");
            }, 5000);
            return;
          }
          window.clearTimeout(armTimer);
          disarm();
          setState("action-state", "Clearing…");
          try {
            var headers = {};
            var key = storedKey();
            if (key) headers["X-API-Key"] = key;
            var response = await fetch("/admin/cache/clear", {
              method: "POST",
              headers: headers,
            });
            if (response.status === 401 || response.status === 403) {
              showAuth("Clearing the cache needs a valid API key.");
              setState("action-state", "Not authorised.", true);
              return;
            }
            var data = await response.json();
            setState("action-state", data.message || "Cache cleared.");
          } catch (error) {
            setState("action-state", "Failed: " + error.message, true);
          }
        });

        el("auth-form").addEventListener("submit", function (event) {
          event.preventDefault();
          var input = el("auth-key");
          var value = input.value.trim();
          if (!value) return;
          storeKey(value);
          input.value = "";
          el("auth").hidden = true;
          refresh();
        });

        // Polling a hidden tab burns CPU on the host for nobody's benefit.
        function schedule() {
          window.clearInterval(timer);
          timer = window.setInterval(function () {
            if (!document.hidden) refresh();
          }, REFRESH_MS);
        }

        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) refresh();
        });

        refresh();
        schedule();
      })();
    </script>
  </body>
</html>
